<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle Radial Glow in Center -->
  <circle cx="256" cy="256" r="160" fill="#2563eb" opacity="0.18" filter="url(#glow)" />

  <!-- Vault Hexagon Shield / Container -->
  <path d="M 256 86 
           L 396 166 
           L 396 326 
           L 256 406 
           L 116 326 
           L 116 166 Z" 
        fill="#0f172a" 
        stroke="url(#primaryGrad)" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- Inner Concentric Vault Ring -->
  <circle cx="256" cy="246" r="88" fill="#1e293b" stroke="#334155" stroke-width="6" opacity="0.8" />

  <!-- Lightning / Venture Spark Icon inside Vault -->
  <path d="M 268 140 
           L 188 250 
           L 248 250 
           L 236 348 
           L 324 230 
           L 264 230 Z" 
        fill="url(#primaryGrad)" 
        filter="url(#glow)" />
        
  <!-- Core Bright Highlight -->
  <path d="M 264 155 
           L 204 245 
           L 252 245 
           L 242 330 
           L 310 235 
           L 260 235 Z" 
        fill="#ffffff" 
        opacity="0.35" />
</svg>
